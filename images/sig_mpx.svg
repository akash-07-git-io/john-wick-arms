<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E2028"/>
      <stop offset="60%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D06B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D1F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="520" height="320" fill="url(#bgGlow)" rx="8"/>
  <rect width="516" height="316" x="2" y="2" fill="none" stroke="#2A2D37" stroke-width="1.5" rx="8"/>

  <!-- Tactical Grid overlay -->
  <g stroke="#1A1C24" stroke-width="1">
    <line x1="0" y1="80" x2="520" y2="80"/>
    <line x1="0" y1="160" x2="520" y2="160"/>
    <line x1="0" y1="240" x2="520" y2="240"/>
    <line x1="130" y1="0" x2="130" y2="320"/>
    <line x1="260" y1="0" x2="260" y2="320"/>
    <line x1="390" y1="0" x2="390" y2="320"/>
  </g>

  <!-- Continental High Table Seal Header -->
  <circle cx="48" cy="40" r="18" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <circle cx="48" cy="40" r="14" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="48" y="44" font-family="'Cinzel', serif, Times" font-size="11" fill="#D4AF37" font-weight="bold" text-anchor="middle">JW</text>

  <!-- Category & Caliber Tags -->
  <rect x="76" y="26" width="90" height="18" rx="3" fill="#1C1E26" stroke="#D4AF37" stroke-width="1"/>
  <text x="121" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#D4AF37" font-weight="bold" text-anchor="middle">SUBMACHINE GUNS</text>

  <rect x="172" y="26" width="120" height="18" rx="3" fill="#16181F" stroke="#3A3E4D" stroke-width="1"/>
  <text x="232" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#9AA0B4" font-weight="600" text-anchor="middle">9x19mm Subsonic</text>

  <text x="495" y="40" font-family="'Cinzel', serif" font-size="10" fill="#D4AF37" text-anchor="end" letter-spacing="2">CONTINENTAL ARMORY</text>

  <!-- Central Firearm Illustration -->
  
        <!-- SMG Silhouette -->
        <g fill="none" stroke="#D4AF37" stroke-width="2.5" opacity="0.9">
            <!-- Folding Stock -->
            <line x1="60" y1="170" x2="140" y2="170" stroke="#D4AF37" stroke-width="3"/>
            <rect x="50" y="160" width="15" height="35" rx="3" fill="#1A1C23" stroke="#D4AF37"/>
            <!-- Receiver -->
            <path d="M 140 150 L 260 150 L 260 195 L 140 195 Z" fill="#252932" stroke="#D4AF37"/>
            <!-- Handguard & Rails -->
            <rect x="260" y="155" width="70" height="35" fill="#1A1C23" stroke="#D4AF37"/>
            <line x1="270" y1="160" x2="320" y2="160" stroke="#D4AF37" stroke-width="1.5" stroke-dasharray="3,3"/>
            <!-- Integrated Suppressor (Silencer) -->
            <rect x="330" y="152" width="105" height="40" rx="6" fill="#16181F" stroke="#D4AF37" stroke-width="2.5"/>
            <line x1="350" y1="152" x2="350" y2="192" stroke="#D4AF37" opacity="0.5"/>
            <line x1="380" y1="152" x2="380" y2="192" stroke="#D4AF37" opacity="0.5"/>
            <line x1="410" y1="152" x2="410" y2="192" stroke="#D4AF37" opacity="0.5"/>
            <!-- Curved Magazine -->
            <path d="M 230 195 L 210 270 L 235 275 L 255 195 Z" fill="#16181F" stroke="#D4AF37"/>
            <!-- Pistol Grip -->
            <path d="M 160 195 L 145 255 L 175 260 L 185 195 Z" fill="#16181F" stroke="#D4AF37"/>
            <!-- Trigger Guard -->
            <path d="M 185 195 Q 200 220 220 195" fill="none" stroke="#D4AF37" stroke-width="2"/>
            <!-- Optic / Red Dot Sight -->
            <rect x="180" y="132" width="40" height="18" rx="2" fill="#1A1C23" stroke="#D4AF37"/>
            <circle cx="200" cy="141" r="3" fill="#FF0055"/>
        </g>
        

  <!-- Footer Specs & Details -->
  <rect x="16" y="278" width="488" height="28" rx="4" fill="#14161D" stroke="#252833"/>
  <text x="30" y="296" font-family="'Cinzel', serif" font-size="11" fill="#FFFFFF" font-weight="bold">SIG MPX TTI SPEC</text>
  <text x="490" y="296" font-family="'Inter', sans-serif" font-size="9.5" fill="#D4AF37" text-anchor="end">Subsonic Suppressed CQB System & Folding Arm Brace</text>
</svg>