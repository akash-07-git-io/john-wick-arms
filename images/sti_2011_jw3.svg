<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E2028"/>
      <stop offset="60%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D06B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D1F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="520" height="320" fill="url(#bgGlow)" rx="8"/>
  <rect width="516" height="316" x="2" y="2" fill="none" stroke="#2A2D37" stroke-width="1.5" rx="8"/>

  <!-- Tactical Grid overlay -->
  <g stroke="#1A1C24" stroke-width="1">
    <line x1="0" y1="80" x2="520" y2="80"/>
    <line x1="0" y1="160" x2="520" y2="160"/>
    <line x1="0" y1="240" x2="520" y2="240"/>
    <line x1="130" y1="0" x2="130" y2="320"/>
    <line x1="260" y1="0" x2="260" y2="320"/>
    <line x1="390" y1="0" x2="390" y2="320"/>
  </g>

  <!-- Continental High Table Seal Header -->
  <circle cx="48" cy="40" r="18" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <circle cx="48" cy="40" r="14" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="48" y="44" font-family="'Cinzel', serif, Times" font-size="11" fill="#D4AF37" font-weight="bold" text-anchor="middle">JW</text>

  <!-- Category & Caliber Tags -->
  <rect x="76" y="26" width="90" height="18" rx="3" fill="#1C1E26" stroke="#D4AF37" stroke-width="1"/>
  <text x="121" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#D4AF37" font-weight="bold" text-anchor="middle">SIDEARMS</text>

  <rect x="172" y="26" width="120" height="18" rx="3" fill="#16181F" stroke="#3A3E4D" stroke-width="1"/>
  <text x="232" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#9AA0B4" font-weight="600" text-anchor="middle">9mm Major</text>

  <text x="495" y="40" font-family="'Cinzel', serif" font-size="10" fill="#D4AF37" text-anchor="end" letter-spacing="2">CONTINENTAL ARMORY</text>

  <!-- Central Firearm Illustration -->
  
        <!-- Pistol Silhouette -->
        <g fill="none" stroke="#D4AF37" stroke-width="2.5" opacity="0.9">
            <!-- Slide -->
            <path d="M 120 130 L 340 130 L 340 165 L 310 165 L 305 175 L 230 175 L 220 170 L 120 170 Z" fill="#1A1C23" stroke="#D4AF37"/>
            <!-- Barrel & Compensator -->
            <rect x="340" y="135" width="40" height="25" rx="3" fill="#252932" stroke="#D4AF37"/>
            <circle cx="370" cy="147" r="5" fill="#D4AF37"/>
            <!-- Slide Serrations -->
            <line x1="140" y1="135" x2="140" y2="160" stroke="#D4AF37" stroke-width="2"/>
            <line x1="150" y1="135" x2="150" y2="160" stroke="#D4AF37" stroke-width="2"/>
            <line x1="160" y1="135" x2="160" y2="160" stroke="#D4AF37" stroke-width="2"/>
            <line x1="315" y1="135" x2="315" y2="160" stroke="#D4AF37" stroke-width="2"/>
            <line x1="325" y1="135" x2="325" y2="160" stroke="#D4AF37" stroke-width="2"/>
            <!-- Sights -->
            <rect x="130" y="122" width="12" height="8" fill="#D4AF37"/>
            <rect x="330" y="124" width="8" height="6" fill="#00FF66"/>
            <!-- Frame & Grip -->
            <path d="M 170 170 L 195 270 L 235 275 L 250 265 L 230 185 L 255 185 L 255 170 Z" fill="#16181F" stroke="#D4AF37"/>
            <!-- Trigger Guard & Trigger -->
            <path d="M 230 185 Q 260 215 285 180" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
            <path d="M 250 183 Q 255 200 245 205" fill="none" stroke="#D4AF37" stroke-width="3"/>
            <!-- Stippling Grip Pattern -->
            <line x1="185" y1="200" x2="215" y2="200" stroke="#D4AF37" stroke-dasharray="2,3"/>
            <line x1="190" y1="220" x2="220" y2="220" stroke="#D4AF37" stroke-dasharray="2,3"/>
            <line x1="195" y1="240" x2="225" y2="240" stroke="#D4AF37" stroke-dasharray="2,3"/>
            <!-- Magwell Extension -->
            <polygon points="190,270 245,275 250,285 185,280" fill="#D4AF37" opacity="0.6"/>
        </g>
        

  <!-- Footer Specs & Details -->
  <rect x="16" y="278" width="488" height="28" rx="4" fill="#14161D" stroke="#252833"/>
  <text x="30" y="296" font-family="'Cinzel', serif" font-size="11" fill="#FFFFFF" font-weight="bold">TTI STI 2011 COMBAT MASTER</text>
  <text x="490" y="296" font-family="'Inter', sans-serif" font-size="9.5" fill="#D4AF37" text-anchor="end">Billet Steel 2011 Frame & Flared Magwell</text>
</svg>