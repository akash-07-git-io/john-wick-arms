<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E2028"/>
      <stop offset="60%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D06B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D1F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="520" height="320" fill="url(#bgGlow)" rx="8"/>
  <rect width="516" height="316" x="2" y="2" fill="none" stroke="#2A2D37" stroke-width="1.5" rx="8"/>

  <!-- Tactical Grid overlay -->
  <g stroke="#1A1C24" stroke-width="1">
    <line x1="0" y1="80" x2="520" y2="80"/>
    <line x1="0" y1="160" x2="520" y2="160"/>
    <line x1="0" y1="240" x2="520" y2="240"/>
    <line x1="130" y1="0" x2="130" y2="320"/>
    <line x1="260" y1="0" x2="260" y2="320"/>
    <line x1="390" y1="0" x2="390" y2="320"/>
  </g>

  <!-- Continental High Table Seal Header -->
  <circle cx="48" cy="40" r="18" fill="none" stroke="#A0AAB2" stroke-width="1.5"/>
  <circle cx="48" cy="40" r="14" fill="none" stroke="#A0AAB2" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="48" y="44" font-family="'Cinzel', serif, Times" font-size="11" fill="#A0AAB2" font-weight="bold" text-anchor="middle">JW</text>

  <!-- Category & Caliber Tags -->
  <rect x="76" y="26" width="90" height="18" rx="3" fill="#1C1E26" stroke="#A0AAB2" stroke-width="1"/>
  <text x="121" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#A0AAB2" font-weight="bold" text-anchor="middle">SHOTGUNS</text>

  <rect x="172" y="26" width="120" height="18" rx="3" fill="#16181F" stroke="#3A3E4D" stroke-width="1"/>
  <text x="232" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#9AA0B4" font-weight="600" text-anchor="middle">12-Gauge Tactical</text>

  <text x="495" y="40" font-family="'Cinzel', serif" font-size="10" fill="#A0AAB2" text-anchor="end" letter-spacing="2">CONTINENTAL ARMORY</text>

  <!-- Central Firearm Illustration -->
  
        <!-- Shotgun Silhouette -->
        <g fill="none" stroke="#A0AAB2" stroke-width="2.5" opacity="0.9">
            <!-- Stock -->
            <path d="M 50 180 L 110 160 L 150 170 L 150 210 L 90 220 L 50 200 Z" fill="#1A1C23" stroke="#A0AAB2"/>
            <!-- Receiver -->
            <rect x="150" y="160" width="100" height="45" rx="3" fill="#252932" stroke="#A0AAB2"/>
            <!-- Shell Ejection Port -->
            <rect x="175" y="168" width="45" height="18" fill="#101114" stroke="#A0AAB2"/>
            <!-- Barrel & Mag Tube -->
            <rect x="250" y="165" width="180" height="18" fill="#1A1C23" stroke="#A0AAB2"/>
            <rect x="250" y="185" width="170" height="14" fill="#1A1C23" stroke="#A0AAB2"/>
            <!-- Breaching Muzzle Choke -->
            <rect x="430" y="162" width="22" height="24" fill="#A0AAB2" opacity="0.8"/>
            <circle cx="440" cy="174" r="3" fill="#101114"/>
            <!-- Fore-end Pump / Handguard -->
            <rect x="270" y="180" width="80" height="24" rx="4" fill="#16181F" stroke="#A0AAB2"/>
            <line x1="285" y1="180" x2="285" y2="204" stroke="#A0AAB2"/>
            <line x1="305" y1="180" x2="305" y2="204" stroke="#A0AAB2"/>
            <line x1="325" y1="180" x2="325" y2="204" stroke="#A0AAB2"/>
            <!-- Trigger & Pistol Grip -->
            <path d="M 150 205 L 140 250 L 165 255 L 175 205 Z" fill="#16181F" stroke="#A0AAB2"/>
            <path d="M 180 205 Q 195 225 210 205" fill="none" stroke="#A0AAB2" stroke-width="2.5"/>
            <line x1="192" y1="205" x2="190" y2="218" stroke="#A0AAB2" stroke-width="3"/>
            <!-- Ghost Ring Sight -->
            <circle cx="165" cy="152" r="5" fill="none" stroke="#A0AAB2" stroke-width="2"/>
            <line x1="420" y1="165" x2="420" y2="155" stroke="#A0AAB2" stroke-width="2"/>
        </g>
        

  <!-- Footer Specs & Details -->
  <rect x="16" y="278" width="488" height="28" rx="4" fill="#14161D" stroke="#252833"/>
  <text x="30" y="296" font-family="'Cinzel', serif" font-size="11" fill="#FFFFFF" font-weight="bold">REMINGTON 870 BREACHER</text>
  <text x="490" y="296" font-family="'Inter', sans-serif" font-size="9.5" fill="#A0AAB2" text-anchor="end">Stand-Off Breaching Choke & Magpul SGA Stock</text>
</svg>