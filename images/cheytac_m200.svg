<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E2028"/>
      <stop offset="60%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D06B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D1F"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="520" height="320" fill="url(#bgGlow)" rx="8"/>
  <rect width="516" height="316" x="2" y="2" fill="none" stroke="#2A2D37" stroke-width="1.5" rx="8"/>

  <!-- Tactical Grid overlay -->
  <g stroke="#1A1C24" stroke-width="1">
    <line x1="0" y1="80" x2="520" y2="80"/>
    <line x1="0" y1="160" x2="520" y2="160"/>
    <line x1="0" y1="240" x2="520" y2="240"/>
    <line x1="130" y1="0" x2="130" y2="320"/>
    <line x1="260" y1="0" x2="260" y2="320"/>
    <line x1="390" y1="0" x2="390" y2="320"/>
  </g>

  <!-- Continental High Table Seal Header -->
  <circle cx="48" cy="40" r="18" fill="none" stroke="#E5C158" stroke-width="1.5"/>
  <circle cx="48" cy="40" r="14" fill="none" stroke="#E5C158" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="48" y="44" font-family="'Cinzel', serif, Times" font-size="11" fill="#E5C158" font-weight="bold" text-anchor="middle">JW</text>

  <!-- Category & Caliber Tags -->
  <rect x="76" y="26" width="90" height="18" rx="3" fill="#1C1E26" stroke="#E5C158" stroke-width="1"/>
  <text x="121" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#E5C158" font-weight="bold" text-anchor="middle">RIFLES</text>

  <rect x="172" y="26" width="120" height="18" rx="3" fill="#16181F" stroke="#3A3E4D" stroke-width="1"/>
  <text x="232" y="39" font-family="'Inter', sans-serif" font-size="9" fill="#9AA0B4" font-weight="600" text-anchor="middle">.408 CheyTac</text>

  <text x="495" y="40" font-family="'Cinzel', serif" font-size="10" fill="#E5C158" text-anchor="end" letter-spacing="2">CONTINENTAL ARMORY</text>

  <!-- Central Firearm Illustration -->
  
        <!-- Rifle / Sniper Silhouette -->
        <g fill="none" stroke="#E5C158" stroke-width="2.5" opacity="0.9">
            <!-- Stock / Chassis -->
            <path d="M 40 180 L 120 160 L 180 165 L 180 205 L 110 215 L 40 195 Z" fill="#1A1C23" stroke="#E5C158"/>
            <line x1="60" y1="165" x2="60" y2="205" stroke="#E5C158" stroke-width="3"/>
            <!-- Monolithic Upper Receiver -->
            <rect x="180" y="155" width="110" height="40" fill="#252932" stroke="#E5C158"/>
            <!-- Free-Float M-LOK Rail Handguard -->
            <rect x="290" y="160" width="110" height="30" fill="#1A1C23" stroke="#E5C158"/>
            <!-- Long Match Barrel -->
            <rect x="400" y="170" width="60" height="12" fill="#16181F" stroke="#E5C158"/>
            <!-- Massive Muzzle Brake -->
            <polygon points="460,165 485,162 485,188 460,185" fill="#E5C158"/>
            <circle cx="472" cy="175" r="3" fill="#101114"/>
            <!-- High-Power Precision Telemetry Scope -->
            <rect x="190" y="125" width="130" height="20" rx="3" fill="#16181F" stroke="#E5C158"/>
            <circle cx="195" cy="135" r="7" fill="#E5C158"/>
            <circle cx="315" cy="135" r="9" fill="#E5C158"/>
            <rect x="215" y="145" width="12" height="10" fill="#E5C158"/>
            <rect x="280" y="145" width="12" height="10" fill="#E5C158"/>
            <!-- Magazine & Magwell -->
            <polygon points="230,195 240,260 265,260 260,195" fill="#16181F" stroke="#E5C158"/>
            <!-- Ergonomic Sniper Grip -->
            <path d="M 175 195 L 160 250 L 190 255 L 200 195 Z" fill="#16181F" stroke="#E5C158"/>
            <!-- Bipod Stood Up -->
            <line x1="380" y1="190" x2="360" y2="240" stroke="#E5C158" stroke-width="2"/>
            <line x1="385" y1="190" x2="400" y2="240" stroke="#E5C158" stroke-width="2"/>
        </g>
        

  <!-- Footer Specs & Details -->
  <rect x="16" y="278" width="488" height="28" rx="4" fill="#14161D" stroke="#252833"/>
  <text x="30" y="296" font-family="'Cinzel', serif" font-size="11" fill="#FFFFFF" font-weight="bold">CHEYTAC M200 INTERVENTION</text>
  <text x="490" y="296" font-family="'Inter', sans-serif" font-size="9.5" fill="#E5C158" text-anchor="end">Extreme Long-Range Anti-Materiel Precision (2000m+)</text>
</svg>