version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_USER=wick_user
      - DB_PASS=continental123
      - DB_NAME=john_wick_arms
    depends_on:
      - db
    volumes:
      - .:/var/www/html

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: john_wick_arms
      MYSQL_USER: wick_user
      MYSQL_PASSWORD: continental123
    ports:
      - "3306:3306"
    volumes:
      - ./database/john_wick_arms.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

volumes:
  db_data:
